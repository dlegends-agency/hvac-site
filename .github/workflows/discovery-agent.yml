name: Discovery agent

# Finds HVAC contractors for the locations set up in Admin > Directory > Discover.
# Free: GitHub Actions minutes (public repos are unlimited) plus free data sources. See scripts/discovery-agent/README.md.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours; each search only runs when its own schedule (or "Run now") says it is due
  workflow_dispatch:
    inputs:
      jobId:
        description: "Run only this search (uuid). Leave empty to run everything that is due or queued."
        required: false
      emailsOnly:
        description: "Only look for the email addresses of businesses that have a website but no email (true/false)."
        required: false
        default: "false"
      emailLimit:
        description: "How many businesses to check when looking for emails only."
        required: false
        default: "200"

permissions:
  contents: read

concurrency:
  group: discovery-agent
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run the agent
        run: node scripts/discovery-agent/index.mjs ${{ github.event.inputs.emailsOnly == 'true' && format('--backfill-emails --limit {0}', github.event.inputs.emailLimit || '200') || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JOB_ID: ${{ github.event.inputs.jobId }}
