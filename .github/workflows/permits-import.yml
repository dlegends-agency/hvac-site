name: Permits import

# Pulls new HVAC permits (heating, cooling and ventilation only) from the Austin and Dallas open-data portals into the public_permits
# table, every day at 8:00 AM Philippine time (PHT is UTC+8, so 00:00 UTC). GitHub can start a scheduled run a few minutes late.
# You can also run it by hand: Actions > Permits import > Run workflow. See scripts/permits/README.md.

on:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC = 8:00 AM Philippine time
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to read."
        required: false
        default: "30"
      perCity:
        description: "The most permits to save for each city."
        required: false
        default: "500"

permissions:
  contents: read

concurrency:
  group: permits-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Import HVAC permits
        # Scheduled runs read the last 14 days (it overlaps the day before, and the same permit is never saved twice).
        run: node scripts/permits/index.mjs --days ${{ github.event.inputs.days || '14' }} --per-city ${{ github.event.inputs.perCity || '500' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
