name: Permits import

# Pulls new HVAC permits (heating, cooling and ventilation only) from the Austin and Dallas open-data portals into the public_permits
# table, keeping only permits whose contractor has a name, phone and email.
# WHEN it runs is set in Admin > Schedule (off, every few hours, every day or every week, in Philippine time). GitHub starts this check every
# 30 minutes; the first step asks the saved schedule whether a scrape is due and the rest is skipped when it is not. You can also run it by
# hand any time: Actions > Permits import > Run workflow (a manual run always scrapes). See scripts/schedule and scripts/permits/README.md.

on:
  schedule:
    - cron: "2,32 * * * *" # every 30 minutes; the saved schedule decides whether to scrape
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to read."
        required: false
        default: "30"
      perCity:
        description: "The most permits to save for each city."
        required: false
        default: "500"

permissions:
  contents: read

concurrency:
  group: permits-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Is a scrape due?
        id: due
        run: node scripts/schedule/due.mjs permits
        env:
          EVENT_NAME: ${{ github.event_name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Install
        if: steps.due.outputs.run == 'true'
        run: npm ci --ignore-scripts
      - name: Import HVAC permits
        id: import
        if: steps.due.outputs.run == 'true'
        # Scheduled runs read the last 14 days (it overlaps the earlier runs, and the same permit is never saved twice).
        run: node scripts/permits/index.mjs --days ${{ github.event.inputs.days || '14' }} --per-city ${{ github.event.inputs.perCity || '500' }} --email-limit 800
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      - name: Record the run
        if: always() && steps.due.outputs.run == 'true'
        run: node scripts/schedule/record.mjs permits "${{ steps.import.outcome }}" "${{ steps.due.outputs.started }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
