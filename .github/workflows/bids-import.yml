name: Bids import

# Reads SAM.gov's public daily file of federal contract opportunities and keeps the open Texas HVAC notices in the gov_bids table.
# Runs every day at 8:30 AM Philippine time (PHT is UTC+8, so 00:30 UTC), after the permits import. GitHub can start a scheduled run a
# few minutes late. You can also run it by hand: Actions > Bids import > Run workflow. See scripts/bids/README.md.

on:
  schedule:
    - cron: "30 0 * * *" # 00:30 UTC = 8:30 AM Philippine time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bids-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Import open Texas HVAC bids
        run: node scripts/bids/index.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
